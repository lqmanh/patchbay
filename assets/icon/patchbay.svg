<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Master app icon. Concept, palette, geometry and export steps: README.md -->
  <defs>
    <linearGradient id="direct-gradient" gradientUnits="userSpaceOnUse" x1="80" y1="56" x2="80" y2="104">
      <stop offset="0" stop-color="#8f7964"/>
      <stop offset="1" stop-color="#685341"/>
    </linearGradient>
    <linearGradient id="vpn-gradient" gradientUnits="userSpaceOnUse" x1="40" y1="56" x2="120" y2="104">
      <stop offset="0" stop-color="#ff903f"/>
      <stop offset="1" stop-color="#ec4826"/>
    </linearGradient>
    <filter id="tile-shadow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="200" height="210">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="direct-shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="160" height="160">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#3a2614" flood-opacity="0.22"/>
    </filter>
    <filter id="vpn-shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="160" height="160">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#b4410c" flood-opacity="0.22"/>
    </filter>
    <!-- 16-unit gap cut out of the direct cable where the VPN cable crosses over it -->
    <mask id="vpn-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="160">
      <rect width="160" height="160" fill="#ffffff"/>
      <path d="M40 56 C40 88 120 72 120 104" fill="none" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
    </mask>
  </defs>
  <!-- macOS grid: the 160-unit tile spans 824px, centered with a 100px margin -->
  <g transform="translate(100 100) scale(5.15)">
    <path id="tile" fill="#ecdcc9" filter="url(#tile-shadow)" d="M102.4 0 c20.16 0 30.24 0 37.94 3.92 a36 36 0 0 1 15.73 15.73 c3.92 7.7 3.92 17.78 3.92 37.94 L160 102.4 c0 20.16 0 30.24 -3.92 37.94 a36 36 0 0 1 -15.73 15.73 c-7.7 3.92 -17.78 3.92 -37.94 3.92 L57.6 160 c-20.16 0 -30.24 0 -37.94 -3.92 a36 36 0 0 1 -15.73 -15.73 c-3.92 -7.7 -3.92 -17.78 -3.92 -37.94 L0 57.6 c0 -20.16 0 -30.24 3.92 -37.94 a36 36 0 0 1 15.73 -15.73 c7.7 -3.92 17.78 -3.92 37.94 -3.92 Z"/>
    <!-- artwork, enlarged 10% around the tile center -->
    <g id="artwork" transform="matrix(1.1 0 0 1.1 -8 -8)">
      <g id="jacks" fill="#f8efe4">
        <circle cx="40" cy="56" r="12"/>
        <circle cx="80" cy="56" r="12"/>
        <circle cx="120" cy="56" r="12"/>
        <circle cx="40" cy="104" r="12"/>
        <circle cx="80" cy="104" r="12"/>
        <circle cx="120" cy="104" r="12"/>
      </g>
      <g id="sockets" fill="#3a2c20">
        <circle cx="40" cy="56" r="6"/>
        <circle cx="80" cy="56" r="6"/>
        <circle cx="120" cy="56" r="6"/>
        <circle cx="40" cy="104" r="6"/>
        <circle cx="80" cy="104" r="6"/>
        <circle cx="120" cy="104" r="6"/>
      </g>
      <g id="cable-direct" mask="url(#vpn-gap)">
        <path d="M80 56 V104" fill="none" stroke="url(#direct-gradient)" stroke-width="8" stroke-linecap="round" filter="url(#direct-shadow)"/>
        <circle cx="80" cy="56" r="9" fill="#8f7964"/>
        <circle cx="80" cy="56" r="3.6" fill="#ead9c6"/>
        <circle cx="80" cy="104" r="9" fill="#685341"/>
        <circle cx="80" cy="104" r="3.6" fill="#ead9c6"/>
      </g>
      <g id="cable-vpn">
        <path d="M40 56 C40 88 120 72 120 104" fill="none" stroke="url(#vpn-gradient)" stroke-width="8" stroke-linecap="round" filter="url(#vpn-shadow)"/>
        <circle cx="40" cy="56" r="9" fill="#ff903f"/>
        <circle cx="40" cy="56" r="3.6" fill="#ffe3d1"/>
        <circle cx="120" cy="104" r="9" fill="#ec4826"/>
        <circle cx="120" cy="104" r="3.6" fill="#ffe3d1"/>
      </g>
    </g>
  </g>
</svg>
